<!DOCTYPE html>
<html lang="fa-IR">
<head>
<title>{{title}}</title>
<meta charset="UTF-8">
<meta name="author" content="M. MAD">
<link rel="icon" type="image/png" href="../../favicon.png">
<link rel="stylesheet" href="../../fonts.css">
<link rel="stylesheet" href="../base-style.css">
<link rel="stylesheet" href="../x-style.css">
<link rel="stylesheet" href="../fonts.css">
</head>
<body dir="rtl" align="right">
<header>
<h1 class="main-heading fa-main-heading">{{title}}</h1>
<nav>
  <a href="/index.html"><span class="nav-icon">🏘</span> پروژه‌ها</a> &gt
  <a href="/l/index.html"><span class="nav-icon">🏫</span> آزمایشگاه‌ها</a> &gt
  <a href="../../index.html"><span class="nav-icon">🌍</span> آزمایشگاه اینترنت اشیاء</a> &gt
  <a href="index.html"><span class="nav-icon">🔬</span> آزمایش‌ها</a>
</nav>
</header>
<article>
<div style="max-width: 100%; overflow: auto;">
<table>
  <tr>
    <th><b class="table-pseudo-heading">ردیف</a></th>
    <th><b class="table-pseudo-heading">نام فایل</a></th>
    <th><b class="table-pseudo-heading">عنوان</b></th>
    <th><b class="table-pseudo-heading">نام</b></th>
  </tr>
  {%- for i, r in enumerate(index, start=1) %}
  <tr>
    <td><a href="{{r.get("link")}}">{{i}}</a></td>
    <td><a href="{{r.get("link")}}">{{r.get("filename")}}</a></td>
    <td><a href="{{r.get("link")}}"><span class="nav-icon">🔬</span> {{r.get("title")}}</a></td>
    <td><a href="{{r.get("link")}}">{{r.get("name")}}</a></td>
  </tr>
  {%- endfor %}
</table>
</div>
</article>
</body>
</html>
