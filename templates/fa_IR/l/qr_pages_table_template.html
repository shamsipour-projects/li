<!DOCTYPE html>
<html lang="fa-IR">
<head>
<title>{{title}}</title>
<meta charset="UTF-8">
<meta name="author" content="M. MAD">
<link rel="icon" type="image/png" href="../../../../favicon.png">
<link rel="stylesheet" href="../../../qr_pages_table_style.css">
<link rel="stylesheet" href="../../../fonts.css">
</head>
<body>
<div class="page-container">
<table>
  {%-  for row in table %}
  <tr>
    {%-  for qr_filename, qr_display_name in row %}
    <td>
      <div class="img-container">
        <img class="qr-code-img" src="../{{qr_filename}}">
      </div>
      <div class="qr-code-title">{{qr_display_name}}</div>
    </td>
    {%- endfor %}
  </tr>
  {%- endfor %}
</table>
<p dir="rtl" align="right" class="work-of">
کاری از:
<b>
محمدمحسن اکبرپور درابی
</b>
</p>
</div>
</body>
</html>
