<!DOCTYPE html>
<html lang="fa-IR">
<head>
<title>{{title}}</title>
<meta charset="UTF-8">
<meta name="author" content="M. MAD">
<link rel="icon" type="image/png" href="../../../favicon.png">
<link rel="stylesheet" href="../../base-style.css">
<link rel="stylesheet" href="../../h-style.css">
<link rel="stylesheet" href="../../fonts.css">
</head>
<body dir="rtl" align="right">
<h1 class="part-heading part-text-heading persian-heading">{{title}}</h1>
<div style="max-width: 100%; overflow: auto;">
<table>
  <tr>
    <th><b class="table-pseudo-heading">نام فایل</a></th>
    <th><b class="table-pseudo-heading">عنوان</b></th>
    <th><b class="table-pseudo-heading">نام قطعه</b></th>
    <th><b class="table-pseudo-heading">سال ساخت</b></th>
    <th><b class="table-pseudo-heading">دسته‌بندی</b></th>
    <th><b class="table-pseudo-heading">نام شرکت سازنده</b></th>
    <th><b class="table-pseudo-heading">کشور سازنده</b></th>
  </tr>
  {%-  for r in index %}
  <tr>
    <td><a href="{{r.get("link")}}">{{r.get("filename")}}</a></td>
    <td><a href="{{r.get("link")}}">{{r.get("title")}}</a></td>
    <td><a href="{{r.get("link")}}">{{r.get("name")}}</a></td>
    <td><a href="{{r.get("link")}}">{{r.get("manufacturing_date")}}</a></td>
    <td><a href="{{r.get("link")}}">{{r.get("category")}}</a></td>
    <td><a href="{{r.get("link")}}">{{r.get("manufacturer_name")}}</a></td>
    <td><a href="{{r.get("link")}}">{{r.get("manufacturer_country")}}</a></td>
  </tr>
  {%- endfor %}
</table>
</div>
</body>
</html>
